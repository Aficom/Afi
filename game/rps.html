<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Rock Paper Scissors</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top left, #1e293b, #0f172a);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            color: white;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 95%;
            max-width: 450px;
            padding: 2.5rem;
            text-align: center;
        }

        .choice-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid transparent;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 1.5rem;
            padding: 1rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .choice-btn:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.15);
            border-color: #6366f1;
        }

        .choice-btn:active {
            transform: scale(0.95);
        }

        .hand-shake {
            animation: shake 0.4s ease-in-out infinite;
        }

        @keyframes shake {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-15px) rotate(-5deg); }
            75% { transform: translateY(15px) rotate(5deg); }
        }

        .winner-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
            backdrop-filter: blur(8px);
        }

        .pulse {
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0px rgba(99, 102, 241, 0.4); }
            100% { box-shadow: 0 0 0 20px rgba(99, 102, 241, 0); }
        }
    </style> 
</head>
<body>  

    <div class="glass-card">
        <h1 class="text-4xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-400 mb-2">Epic RPS</h1>
        <p class="text-gray-400 mb-8 text-sm font-medium tracking-widest uppercase">Target: 10 Points</p>

        <!-- Scoreboard -->
        <div class="flex justify-between items-center bg-black/30 rounded-3xl p-6 mb-8 border border-white/5">
            <div class="text-center">
                <p class="text-xs uppercase tracking-widest text-indigo-300 font-bold mb-1">Player</p>
                <p id="user-score" class="text-5xl font-black text-white">0</p>
            </div>
            <div class="h-12 w-px bg-white/10"></div>
            <div class="text-center">
                <p class="text-xs uppercase tracking-widest text-red-400 font-bold mb-1">CPU</p>
                <p id="cpu-score" class="text-5xl font-black text-white">0</p>
            </div>
        </div>

        <!-- Game Display -->
        <div class="relative h-44 flex items-center justify-around mb-8 bg-white/5 rounded-2xl overflow-hidden">
            <div id="user-display" class="text-7xl transition-all duration-300">✊</div>
            <div class="flex flex-col items-center">
                <span class="text-xs font-bold text-gray-500 mb-1">VS</span>
                <div class="w-8 h-px bg-gray-700"></div>
            </div>
            <div id="cpu-display" class="text-7xl transition-all duration-300">✊</div>
        </div>

        <div id="message" class="h-12 flex items-center justify-center text-lg font-semibold mb-8 text-gray-200">
            Choose your weapon!
        </div>

        <!-- Controls -->
        <div class="grid grid-cols-3 gap-4">
            <button onclick="play('rock')" class="choice-btn group">
                <div class="text-4xl mb-2">🌑</div>
                <span class="text-xs font-bold text-gray-400 group-hover:text-white uppercase tracking-tighter">Rock</span>
            </button>
            <button onclick="play('paper')" class="choice-btn group">
                <div class="text-4xl mb-2">📄</div>
                <span class="text-xs font-bold text-gray-400 group-hover:text-white uppercase tracking-tighter">Paper</span>
            </button>
            <button onclick="play('scissors')" class="choice-btn group">
                <div class="text-4xl mb-2">✂️</div>
                <span class="text-xs font-bold text-gray-400 group-hover:text-white uppercase tracking-tighter">Scissors</span>
            </button>
        </div>

        <button onclick="resetGame()" class="mt-10 text-gray-500 hover:text-white transition-colors text-xs font-bold uppercase tracking-widest flex items-center justify-center mx-auto">
            <i class="fas fa-rotate-left mr-2"></i> Reset Session
        </button>
    </div>

    <!-- Winner Modal -->
    <div id="winner-modal" class="winner-modal">
        <div class="bg-gray-900 p-10 rounded-[3rem] border border-white/10 text-center max-w-sm w-full mx-4">
            <div id="winner-icon" class="text-8xl mb-6">🏆</div>
            <h2 id="winner-text" class="text-3xl font-black mb-2 text-white">YOU WON!</h2>
            <p class="text-gray-400 mb-8">What an amazing performance!</p>
            <button onclick="resetGame()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl font-bold text-lg shadow-lg shadow-indigo-500/30 transition-all">
                Play Again
            </button>
        </div>
    </div>

    <script>
        let userScore = 0;
        let cpuScore = 0;
        let isPlaying = false;
        const choices = ['rock', 'paper', 'scissors'];
        const emojiMap = {
            'rock': '🌑',
            'paper': '📄',
            'scissors': '✂️'
        };

        function play(userChoice) {
            if (isPlaying) return;
            isPlaying = true;

            const userDisplay = document.getElementById('user-display');
            const cpuDisplay = document.getElementById('cpu-display');
            const messageEl = document.getElementById('message');

            // Reset displays to rock for animation
            userDisplay.innerText = '✊';
            cpuDisplay.innerText = '✊';
            userDisplay.classList.add('hand-shake');
            cpuDisplay.classList.add('hand-shake');
            messageEl.innerText = "Rock... Paper... Scissors!";
            messageEl.className = "h-12 flex items-center justify-center text-lg font-semibold mb-8 text-yellow-400";

            setTimeout(() => {
                userDisplay.classList.remove('hand-shake');
                cpuDisplay.classList.remove('hand-shake');

                const cpuChoice = choices[Math.floor(Math.random() * 3)];
                
                userDisplay.innerText = emojiMap[userChoice];
                cpuDisplay.innerText = emojiMap[cpuChoice];

                const result = getResult(userChoice, cpuChoice);
                updateScore(result);
                displayMessage(result, userChoice, cpuChoice);
                checkGameOver();
                
                isPlaying = false;
            }, 700);
        }

        function getResult(user, cpu) {
            if (user === cpu) return 'draw';
            if (
                (user === 'rock' && cpu === 'scissors') ||
                (user === 'paper' && cpu === 'rock') ||
                (user === 'scissors' && cpu === 'paper')
            ) {
                return 'win';
            }
            return 'lose';
        }

        function updateScore(result) {
            if (result === 'win') {
                userScore++;
                const el = document.getElementById('user-score');
                el.innerText = userScore;
                el.classList.add('scale-125', 'text-green-400');
                setTimeout(() => el.classList.remove('scale-125', 'text-green-400'), 300);
            } else if (result === 'lose') {
                cpuScore++;
                const el = document.getElementById('cpu-score');
                el.innerText = cpuScore;
                el.classList.add('scale-125', 'text-red-400');
                setTimeout(() => el.classList.remove('scale-125', 'text-red-400'), 300);
            }
        }

        function displayMessage(result, user, cpu) {
            const messageEl = document.getElementById('message');
            messageEl.className = "h-12 flex items-center justify-center text-lg font-semibold mb-8 transition-all duration-300";

            if (result === 'win') {
                messageEl.innerHTML = `<span class="text-green-400">Point for You!</span>`;
                messageEl.classList.add('scale-110');
            } else if (result === 'lose') {
                messageEl.innerHTML = `<span class="text-red-400">Point for CPU!</span>`;
            } else {
                messageEl.innerHTML = `<span class="text-gray-400">It's a Draw!</span>`;
            }
        }

        function checkGameOver() {
            if (userScore >= 10 || cpuScore >= 10) {
                const modal = document.getElementById('winner-modal');
                const winText = document.getElementById('winner-text');
                const winIcon = document.getElementById('winner-icon');
                
                modal.style.display = 'flex';
                if (userScore >= 10) {
                    winText.innerText = "VICTORY!";
                    winText.className = "text-3xl font-black mb-2 text-green-400";
                    winIcon.innerText = "👑";
                } else {
                    winText.innerText = "DEFEAT!";
                    winText.className = "text-3xl font-black mb-2 text-red-500";
                    winIcon.innerText = "🤖";
                }
            }
        }

        function resetGame() {
            userScore = 0;
            cpuScore = 0;
            isPlaying = false;
            document.getElementById('user-score').innerText = '0';
            document.getElementById('cpu-score').innerText = '0';
            document.getElementById('message').innerText = "Choose your weapon!";
            document.getElementById('message').className = "h-12 flex items-center justify-center text-lg font-semibold mb-8 text-gray-200";
            document.getElementById('user-display').innerText = '✊';
            document.getElementById('cpu-display').innerText = '✊';
            document.getElementById('winner-modal').style.display = 'none';
        }
    </script>
</body>
</html>
