<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Tab Web Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .tab-content {
            display: none;
            height: calc(100vh - 110px);
            width: 100%;
        }
        .tab-content.active {
            display: block;
        }
        .tab-button.active {
            background-color: white;
            border-bottom: 2px solid #3b82f6;
            color: #3b82f6;
        }
        iframe {
            border: none;
            width: 100%;
            height: 100%;
            background-color: #f3f4f6;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-gray-100 flex flex-col">

    <!-- Header Section -->
    <header class="bg-white shadow-sm border-b p-3 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <div class="bg-blue-600 p-2 rounded-lg">
                <i class="fas fa-globe text-white"></i>
            </div>
            <h1 class="text-xl font-bold text-gray-800 hidden sm:block">WebHub Tabber</h1>
        </div>

        <div class="flex-1 max-w-2xl mx-4">
            <div class="relative group">
                <input type="text" id="urlInput" 
                    placeholder="Website link..." 
                    class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-full focus:ring-blue-500 focus:border-blue-500 block p-2.5 px-5 transition-all">
                <button onclick="updateActiveTab()" class="absolute right-2 top-1/2 -translate-y-1/2 bg-blue-600 text-white p-1.5 px-4 rounded-full hover:bg-blue-700 text-xs font-medium transition-colors">
                    Go
                </button>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <button onclick="openInNewWindow()" title="Open in real new tab" class="bg-gray-100 hover:bg-gray-200 text-gray-700 p-2.5 rounded-full shadow-sm transition-all">
                <i class="fas fa-external-link-alt"></i>
            </button>
            <button onclick="createNewTab()" class="bg-green-500 hover:bg-green-600 text-white p-2.5 rounded-full shadow-md transition-transform hover:scale-110">
                <i class="fas fa-plus"></i>
            </button>
        </div>
        
    </header>

    <!-- Tabs Bar -->
    <div id="tabsBar" class="flex bg-gray-200 p-1 space-x-1 overflow-x-auto">
        <!-- Tabs will be injected here -->
    </div>

    <!-- Main Content (Iframes) -->
    <main id="mainContent" class="flex-1 bg-white relative">
        <div id="welcomeScreen" class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 bg-white z-10">
            <i class="fas fa-browser text-6xl text-gray-300 mb-4"></i>
            <h2 class="text-2xl font-bold text-gray-700">Welcome!</h2>
           
            <div class="mt-6 flex space-x-4">
                <button onclick="createNewTab('https://www.wikipedia.org')" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm font-medium">Wikipedia</button>
                <button onclick="createNewTab('https://www.bing.com')" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm font-medium">Bing</button>
            </div>
        </div>
    </main>

    <script>
        let tabs = [];
        let activeTabId = null;

        function createNewTab(url = '') {
            document.getElementById('welcomeScreen').style.display = 'none';
            const tabId = 'tab-' + Date.now();
            const newTab = {
                id: tabId,
                url: url || 'about:blank',
                title: url ? (url.replace('https://', '').split('/')[0]) : 'New Tab'
            };

            tabs.push(newTab);
            renderTabs();
            setActiveTab(tabId);
            
            if(url) {
                document.getElementById('urlInput').value = url;
            } else {
                document.getElementById('urlInput').value = '';
                document.getElementById('urlInput').focus();
            }
        }

        function renderTabs() {
            const tabsBar = document.getElementById('tabsBar');
            tabsBar.innerHTML = '';

            tabs.forEach(tab => {
                const tabBtn = document.createElement('div');
                tabBtn.className = `tab-button flex items-center min-w-[120px] max-w-[200px] px-4 py-2 cursor-pointer rounded-t-lg transition-all text-sm font-medium truncate ${tab.id === activeTabId ? 'active bg-white' : 'bg-gray-300 hover:bg-gray-400 text-gray-600'}`;
                tabBtn.onclick = () => setActiveTab(tab.id);
                
                tabBtn.innerHTML = `
                    <span class="truncate flex-1">${tab.title}</span>
                    <button onclick="closeTab(event, '${tab.id}')" class="ml-2 text-gray-400 hover:text-red-500 transition-colors">
                        <i class="fas fa-times-circle"></i>
                    </button>
                `;
                tabsBar.appendChild(tabBtn);
            });
        }

        function setActiveTab(id) {
            activeTabId = id;
            renderTabs();

            // Hide all tab contents
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(c => c.classList.remove('active'));

            // Check if iframe exists, if not create it
            let activeContent = document.getElementById(`content-${id}`);
            if (!activeContent) {
                activeContent = document.createElement('div');
                activeContent.id = `content-${id}`;
                activeContent.className = 'tab-content active';
                
                const currentTab = tabs.find(t => t.id === id);
                activeContent.innerHTML = `
                    <div class="bg-red-50 text-[10px] sm:text-xs p-2 text-center text-red-600 border-b flex items-center justify-center gap-2">
                        <i class="fas fa-exclamation-triangle"></i>
                        <span>Google has privacy</span>
                    </div>
                    <iframe src="${currentTab.url}" title="${currentTab.title}"></iframe>
                `;
                document.getElementById('mainContent').appendChild(activeContent);
            } else {
                activeContent.classList.add('active');
            }

            // Update URL input
            const currentTab = tabs.find(t => t.id === id);
            document.getElementById('urlInput').value = currentTab.url === 'about:blank' ? '' : currentTab.url;
        }

        function closeTab(event, id) {
            event.stopPropagation();
            const index = tabs.findIndex(t => t.id === id);
            
            // Remove from array
            tabs = tabs.filter(t => t.id !== id);
            
            // Remove DOM elements
            const content = document.getElementById(`content-${id}`);
            if(content) content.remove();

            if (tabs.length === 0) {
                activeTabId = null;
                document.getElementById('welcomeScreen').style.display = 'flex';
                renderTabs();
            } else if (id === activeTabId) {
                // Set new active tab if we closed the active one
                const newIndex = Math.min(index, tabs.length - 1);
                setActiveTab(tabs[newIndex].id);
            } else {
                renderTabs();
            }
        }

        function updateActiveTab() {
            if (!activeTabId) {
                createNewTab(document.getElementById('urlInput').value);
                return;
            }

            let url = document.getElementById('urlInput').value;
            if (!url && url !== "") return;
            
            if (url && !url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            const currentTab = tabs.find(t => t.id === activeTabId);
            currentTab.url = url || 'about:blank';
            currentTab.title = url ? url.replace('https://', '').replace('http://', '').split('/')[0] : 'New Tab';
            
            const activeContent = document.getElementById(`content-${activeTabId}`);
            if (activeContent) {
                activeContent.querySelector('iframe').src = currentTab.url;
            }
            
            renderTabs();
        }

        function openInNewWindow() {
            const url = document.getElementById('urlInput').value;
            if (url) {
                let finalUrl = url;
                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    finalUrl = 'https://' + url;
                }
                window.open(finalUrl, '_blank');
            }
        }

        // Enter key support for URL input
        document.getElementById('urlInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                updateActiveTab();
            }
        });
    </script>
</body>
</html>
